<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gothic Wizard's Chess 3D</title>
  
  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="./styles.css" />
  <!-- Google Material Symbols & Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
  
  <!-- Chess.js CDN for full chess rules & engine validation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  
  <!-- Three.js & OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    canvas {
      outline: none;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body class="h-full flex flex-col bg-slate-950 text-slate-100 antialiased overflow-hidden selection:bg-purple-500/30">

  <!-- Main Viewport Canvas Box -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></div>

  <!-- UI Overlay Container -->
  <div class="relative z-10 flex flex-col h-full pointer-events-none justify-between p-3 md:p-6">
    
    <!-- Top Bar: Single-Level Navigation & Status -->
    <header class="flex items-center justify-between w-full max-w-7xl mx-auto gap-4 pointer-events-auto">
      <div class="flex items-center gap-3 bg-slate-900/80 backdrop-blur-md px-4 py-2.5 rounded-2xl border border-slate-800 shadow-xl">
        <div class="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/40 flex items-center justify-center text-purple-300">
          <span class="material-symbols-outlined text-2xl">castle</span>
        </div>
        <div>
          <h1 class="font-serif font-bold text-base md:text-lg tracking-wide text-amber-100/90 leading-tight">Wizard's Chess</h1>
          <p id="game-subtitle" class="text-xs text-slate-400 font-medium">Gothic Sanctuary</p>
        </div>
      </div>

      <!-- Turn Indicator Pill -->
      <div id="status-pill" class="flex items-center gap-3 bg-slate-900/80 backdrop-blur-md px-5 py-2.5 rounded-full border border-slate-800 shadow-xl transition-all duration-300">
        <div id="turn-dot" class="w-3.5 h-3.5 rounded-full bg-slate-200 shadow-[0_0_10px_rgba(255,255,255,0.8)] animate-pulse"></div>
        <span id="turn-text" class="text-sm font-semibold tracking-wide text-slate-200">White's Turn</span>
        <div id="ai-thinking" class="hidden flex items-center gap-1.5 ml-1 text-purple-400">
          <span class="material-symbols-outlined text-sm animate-spin">progress_activity</span>
          <span class="text-xs font-medium">Thinking...</span>
        </div>
      </div>

      <!-- Quick Action Group -->
      <div class="flex items-center gap-2 bg-slate-900/80 backdrop-blur-md p-1.5 rounded-2xl border border-slate-800 shadow-xl">
        <button id="btn-sound" title="Toggle Sound" class="p-2.5 rounded-xl hover:bg-slate-800/80 text-slate-300 hover:text-white transition-colors">
          <span class="material-symbols-outlined text-xl">volume_up</span>
        </button>
        <button id="btn-camera" title="Cycle Camera Angle" class="p-2.5 rounded-xl hover:bg-slate-800/80 text-slate-300 hover:text-white transition-colors">
          <span class="material-symbols-outlined text-xl">videocam</span>
        </button>
        <button id="btn-history-toggle" title="Toggle Move Log" class="p-2.5 rounded-xl hover:bg-slate-800/80 text-slate-300 hover:text-white transition-colors">
          <span class="material-symbols-outlined text-xl">history</span>
        </button>
      </div>
    </header>

    <!-- Side Panel Overlay: History & Graveyard -->
    <div id="side-drawer" class="fixed right-4 top-20 bottom-24 w-80 bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-4 flex flex-col gap-4 shadow-2xl transition-all duration-300 translate-x-[120%] pointer-events-auto z-20">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div class="flex items-center gap-2 text-amber-200/90 font-serif font-semibold">
          <span class="material-symbols-outlined text-xl">scroll</span>
          <span>Chronicles of Battle</span>
        </div>
        <button id="btn-close-drawer" class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800">
          <span class="material-symbols-outlined text-lg">close</span>
        </button>
      </div>

      <!-- Graveyard Counter -->
      <div class="flex flex-col gap-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Captured Fragments</span>
        <div class="grid grid-cols-2 gap-2">
          <!-- White Fallen -->
          <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/60 flex flex-col gap-1">
            <span class="text-[10px] text-slate-400 uppercase tracking-wider">Marble Lost</span>
            <div id="captured-white" class="flex flex-wrap gap-1 min-h-[24px] text-slate-300 text-xs">None</div>
          </div>
          <!-- Black Fallen -->
          <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/60 flex flex-col gap-1">
            <span class="text-[10px] text-slate-400 uppercase tracking-wider">Obsidian Lost</span>
            <div id="captured-black" class="flex flex-wrap gap-1 min-h-[24px] text-slate-400 text-xs">None</div>
          </div>
        </div>
      </div>

      <!-- Move History Notation Log -->
      <div class="flex-1 flex flex-col min-h-0">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Notation</span>
        <div id="move-history-list" class="flex-1 overflow-y-auto pr-1 space-y-1 font-mono text-xs">
          <!-- Populated dynamically -->
          <div class="text-slate-500 italic text-center py-4">No moves played yet</div>
        </div>
      </div>
    </div>

    <!-- Bottom Floating Action Navigation Dock -->
    <footer class="w-full max-w-2xl mx-auto pointer-events-auto mb-2">
      <div class="bg-slate-900/85 backdrop-blur-xl p-2 rounded-full border border-slate-800 shadow-2xl flex items-center justify-between gap-1 md:gap-2">
        
        <!-- Undo Button -->
        <button id="btn-undo" class="flex items-center gap-2 px-4 py-2.5 rounded-full hover:bg-slate-800/80 text-slate-300 hover:text-white transition-all text-sm font-medium">
          <span class="material-symbols-outlined text-lg">undo</span>
          <span class="hidden sm:inline">Undo</span>
        </button>

        <!-- Mode / Difficulty Selector -->
        <div class="relative group">
          <button id="btn-mode-select" class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-slate-800/60 hover:bg-slate-800 text-slate-200 transition-all text-sm font-medium border border-slate-700/50">
            <span class="material-symbols-outlined text-lg text-purple-400" id="mode-icon">smart_toy</span>
            <span id="mode-label">AI: Medium</span>
            <span class="material-symbols-outlined text-sm text-slate-400">expand_more</span>
          </button>
          
          <!-- Dropdown menu -->
          <div class="absolute bottom-full mb-3 left-0 w-48 bg-slate-900 border border-slate-800 rounded-2xl p-1.5 shadow-2xl opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-all duration-200">
            <button data-mode="pvp" class="mode-opt w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-purple-600/20 hover:text-purple-300 flex items-center gap-2">
              <span class="material-symbols-outlined text-base">group</span> 2 Player Local
            </button>
            <button data-mode="ai-easy" class="mode-opt w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-purple-600/20 hover:text-purple-300 flex items-center gap-2">
              <span class="material-symbols-outlined text-base">sentiment_satisfied</span> AI: Novice
            </button>
            <button data-mode="ai-medium" class="mode-opt w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-purple-600/20 hover:text-purple-300 flex items-center gap-2">
              <span class="material-symbols-outlined text-base">smart_toy</span> AI: Apprentice
            </button>
            <button data-mode="ai-hard" class="mode-opt w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-purple-600/20 hover:text-purple-300 flex items-center gap-2">
              <span class="material-symbols-outlined text-base">psychology</span> AI: Archmage
            </button>
          </div>
        </div>

        <!-- Theme Selector -->
        <div id="theme-selector" class="relative">
          <button id="btn-theme-select" aria-expanded="false" aria-controls="theme-menu" class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-slate-800/60 hover:bg-slate-800 text-slate-200 transition-all text-sm font-medium border border-slate-700/50">
            <span class="material-symbols-outlined text-lg text-purple-400" id="theme-icon">palette</span>
            <span id="theme-label">Classic</span>
            <span class="material-symbols-outlined text-sm text-slate-400">expand_more</span>
          </button>

          <div id="theme-menu" class="absolute bottom-full right-0 w-48 bg-slate-900 border border-slate-800 rounded-2xl p-1.5 shadow-2xl opacity-0 pointer-events-none transition-all duration-200 z-20">
            <button data-theme="classic" class="theme-opt w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-purple-600/20 hover:text-purple-300 flex items-center gap-2">
              <span class="material-symbols-outlined text-base">castle</span> Classic
            </button>
            <button data-theme="walnut" class="theme-opt w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-purple-600/20 hover:text-purple-300 flex items-center gap-2">
              <span class="material-symbols-outlined text-base">forest</span> Walnut
            </button>
            <button data-theme="emerald" class="theme-opt w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-purple-600/20 hover:text-purple-300 flex items-center gap-2">
              <span class="material-symbols-outlined text-base">eco</span> Emerald
            </button>
            <button data-theme="voxel" class="theme-opt w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-purple-600/20 hover:text-purple-300 flex items-center gap-2">
              <span class="material-symbols-outlined text-base">grid_4x4</span> Voxel Grove
            </button>
          </div>
        </div>

        <!-- Flip Board Button -->
        <button id="btn-flip" class="flex items-center gap-2 px-4 py-2.5 rounded-full hover:bg-slate-800/80 text-slate-300 hover:text-white transition-all text-sm font-medium">
          <span class="material-symbols-outlined text-lg">screen_rotation</span>
          <span class="hidden sm:inline">Flip</span>
        </button>

        <!-- New Game Button -->
        <button id="btn-restart" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-purple-600 hover:bg-purple-500 text-white transition-all text-sm font-semibold shadow-lg shadow-purple-600/30">
          <span class="material-symbols-outlined text-lg">restart_alt</span>
          <span>Restart</span>
        </button>

      </div>
    </footer>
  </div>

  <!-- End Game Dialog Modal -->
  <div id="modal-gameover" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full mx-4 text-center shadow-2xl flex flex-col items-center gap-5">
      <div class="w-16 h-16 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-300">
        <span class="material-symbols-outlined text-4xl" id="modal-icon">emoji_events</span>
      </div>
      <div>
        <h2 id="modal-title" class="font-serif text-2xl font-bold text-amber-100">Victory Decided</h2>
        <p id="modal-desc" class="text-slate-400 text-sm mt-1">Checkmate achieved on the grand hall floor.</p>
      </div>
      <button id="btn-modal-restart" class="w-full py-3.5 rounded-2xl bg-purple-600 hover:bg-purple-500 text-white font-semibold shadow-lg shadow-purple-600/30 transition-all">
        Begin New Duel
      </button>
    </div>
  </div>
  <!-- Main Game Logic Scripts -->
  <script src="./game-state.js"></script>
  <script src="./ui-controller.js"></script>
  <script src="./ai-controller.js"></script>
  <script src="./game-controller.js"></script>
  <script src="./app.js"></script>
</body>
</html>
